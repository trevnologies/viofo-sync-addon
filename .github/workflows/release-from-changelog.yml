name: Release from Changelog

# Fires whenever CHANGELOG.md changes on main, or you trigger it by hand.
on:
  push:
    branches: [main]
    paths:
      - 'viofo-sync/CHANGELOG.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.8.6). Leave blank to use the top entry in CHANGELOG.md.'
        required: false
        type: string

permissions:
  contents: write

env:
  # Adjust this if CHANGELOG.md actually lives somewhere else in the repo.
  CHANGELOG_PATH: viofo-sync/CHANGELOG.md

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Pulls the newest version heading out of CHANGELOG.md.
      # Handles this repo's actual format: no brackets around the version,
      # and heading level isn't consistent (### 1.8.9 / ### 1.8.8 up top,
      # ## 1.8.7 and older below). A version heading is identified as any
      # ## or ### line whose first token is a version number — that's
      # what tells it apart from nested "### Fixed" / "### Added" /
      # "### Changed" subsection headings inside the older entries.
      - name: Extract version and release notes
        id: changelog
        run: |
          if [ ! -f "$CHANGELOG_PATH" ]; then
            echo "No file at $CHANGELOG_PATH — update the CHANGELOG_PATH env var at the top of this workflow" >&2
            exit 1
          fi

          INPUT_VERSION="${{ inputs.version }}"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(grep -m 1 -oP '^(##|###)\s+\K[0-9]+\.[0-9]+\.[0-9]+' "$CHANGELOG_PATH")
          fi

          if [ -z "$VERSION" ]; then
            echo "Could not determine a version to release" >&2
            exit 1
          fi
          echo "Releasing version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Pull that version's section out of CHANGELOG.md, wherever it
          # appears in the file — stops at the next real version heading,
          # ignoring nested "### Fixed"/"### Added"/"### Changed" subheadings.
          # Uses (##|###) instead of #{2,3}: Ubuntu's default awk is mawk,
          # which doesn't support {n,m} interval regex — that was the cause
          # of the "exit code 2" failure.
          awk -v ver="$VERSION" '
            BEGIN {
              gsub(/\./, "\\.", ver)
              start = "^(##|###)[[:space:]]+" ver "([[:space:]]|$)"
            }
            $0 ~ start { grabbing = 1; next }
            grabbing && /^(##|###)[[:space:]]+[0-9]+\.[0-9]+\.[0-9A-Za-z]+/ { exit }
            grabbing { print }
          ' "$CHANGELOG_PATH" > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "No section found in $CHANGELOG_PATH matching version $VERSION" >&2
            exit 1
          fi

      # Builds the badge with the tag baked in, so it always matches
      # whatever version this specific release actually is.
      - name: Assemble release body
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          {
            cat release_notes.md
            echo ""
            echo "[![GitHub Stars](https://img.shields.io/github/stars/trevnologies/viofo-sync-addon.svg)](https://github.com/trevnologies/viofo-sync-addon/stargazers)"
          } > full_release_body.md

      # Creates the tag only if it doesn't already exist on the remote,
      # so re-running the workflow (or a workflow_dispatch) never moves
      # a tag that's already shipped.
      - name: Create tag if it doesn't exist
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists on origin, leaving it as-is"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${VERSION}"
            git push origin "${VERSION}"
          fi

      # Creates the release if the tag is new, or updates the existing
      # release's notes/badge in place if it's already there.
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.changelog.outputs.version }}
          name: ${{ steps.changelog.outputs.version }}
          body_path: full_release_body.md
          draft: false
          prerelease: false