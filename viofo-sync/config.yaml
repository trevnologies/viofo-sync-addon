name: "VIOFO Sync"
description: "Downloads protected (RO) videos from your VIOFO dashcam to your NAS, then deletes them from the camera."
version: "1.8.10"
url: "https://github.com/trevnologies/viofo-sync-addon"
slug: "viofo_sync"
startup: application
boot: auto
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
map:
  - type: share
    read_only: false
options:
  cam_ip: "192.168.1.100"
  dest_subdir: "Dashcam"
  schedule_interval_minutes: 0
  delete_after_download: true
  dry_run: false
  sync_on_startup: true
  skip_startup_sync_when_away: true
  presence_entity: "person.your_name"
  ui_notifications: true
  ui_notify_config_change: true
  mqtt_user: ""
  mqtt_pass: ""
schema:
  cam_ip: str
  dest_subdir: str
  schedule_interval_minutes: int(0,1440)
  delete_after_download: bool
  dry_run: bool
  sync_on_startup: bool
  skip_startup_sync_when_away: bool
  presence_entity: str
  ui_notifications: bool
  ui_notify_config_change: bool
  mqtt_user: str
  mqtt_pass: password
# Only the Home Assistant Core API proxy is used (fire events, persistent_notification).
# auth_api / hassio_api / hassio_role:manager were unused — removed for least privilege.
homeassistant_api: true
apparmor: true
ports: {}
host_network: false
stdin: false
uart: false
usb: false
gpio: false