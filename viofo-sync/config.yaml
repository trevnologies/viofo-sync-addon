name: "VIOFO Sync"
description: "Downloads protected (RO) videos from your VIOFO dashcam to your NAS, then deletes them from the camera."
version: "1.8.7"
slug: "viofo_sync"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
map:
  - share:rw
options:
  cam_ip: "192.168.1.100"
  dest_subdir: "Dashcam"
  schedule_interval_minutes: 0
  delete_after_download: true
  dry_run: false
  sync_on_startup: true
  ui_notifications: true
  ui_notify_config_change: true
  mqtt_user: ""
  mqtt_pass: ""
schema:
  cam_ip: str
  dest_subdir: str
  schedule_interval_minutes: int(0,1440)
  delete_after_download: bool
  dry_run: bool
  sync_on_startup: bool
  ui_notifications: bool
  ui_notify_config_change: bool
  mqtt_user: str
  mqtt_pass: password
homeassistant_api: true
auth_api: true
hassio_api: true
hassio_role: manager
apparmor: false
ports: {}
host_network: false
stdin: false
uart: false
usb: false
gpio: false
documentation: https://github.com/trevnologies/viofo-sync-addon/blob/main/README.md
url: https://github.com/trevnologies/viofo-sync-addon
